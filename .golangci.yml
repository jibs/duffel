version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets: []
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$
